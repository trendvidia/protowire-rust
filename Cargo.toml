[workspace]
resolver = "2"
members = [
    "crates/protowire",
    "crates/protowire-pb",
    "crates/protowire-envelope",
    "crates/protowire-pxf",
    "crates/protowire-sbe",
    "crates/dump-envelope",
    "crates/bench-pxf",
    "crates/bench-sbe",
    "crates/check-decode",
]

[workspace.package]
version = "1.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/trendvidia/protowire-rust"
homepage = "https://protowire.org"
authors = ["TrendVidia, LLC <open-source@trendvidia.com>"]
keywords = ["protobuf", "pxf", "sbe", "wire-format", "fix"]
categories = ["encoding", "parser-implementations", "network-programming"]
readme = "README.md"

[workspace.dependencies]
protowire = { path = "crates/protowire", version = "1.1.0" }
protowire-pb = { path = "crates/protowire-pb", version = "1.1.0" }
protowire-envelope = { path = "crates/protowire-envelope", version = "1.1.0" }
protowire-pxf = { path = "crates/protowire-pxf", version = "1.1.0" }
protowire-sbe = { path = "crates/protowire-sbe", version = "1.1.0" }

prost = "0.14"
prost-build = "0.14"
prost-reflect = "0.16"
prost-types = "0.14"
bytes = "1.7"
thiserror = "2.0"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

# HOLD: prost-reflect 0.16.5 refuses editions. This runs the two editions
# fixtures against andrewhickman/prost-reflect#207. A [patch] never reaches
# this crate's published users, so replace it with a version bump once
# upstream releases the change, then merge.
[patch.crates-io]
prost-reflect = { git = "https://github.com/trendvidia/prost-reflect", rev = "f82c954a7842ab2e32a18aa3bc4aa1e8c144a258" }
