// Local fixture for a pxf.Secret written as a string literal
// (draft -01 § pxf.Secret).
syntax = "proto3";
package secretlit.v1;

import "pxf/secret.proto";

message S {
  pxf.Secret pw = 1;
  repeated pxf.Secret pws = 2;
  map<string, pxf.Secret> by_tenant = 3;
}
