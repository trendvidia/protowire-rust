// Local fixture for writing an unset annotated field so that it reads back
// (#116, protowire-go#259). Mirrors unsetAnnotatedProtoSrc in
// protowire-go's encoding/pxf/marshal_unset_annotated_test.go, plus the
// _null-mask message of its TestMarshal_UnsetDefaultedInNullMaskMessageHasNoText.
syntax = "proto3";
package unsetann.v1;

import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "pxf/annotations.proto";

message M {
