// Local fixture for UnmarshalOptions::on_secret_field (#127). SecretDemo and
// DB are the schemas of protowire-go's encoding/pxf/secret_test.go and
// secret_hook_test.go; Holder adds the other places a Secret can sit, for
// the hook's path: nested lists and maps of messages, int and bool map
// keys, and an Any body.
syntax = "proto3";
package secret_hook_test.v1;

import "google/protobuf/any.proto";
import "pxf/secret.proto";

message SecretDemo {
  string base_url = 1;
  pxf.Secret db_password = 2;
  pxf.Secret api_token = 3;
  repeated pxf.Secret backup_keys = 4;
  map<string, pxf.Secret> tenant_keys = 5;
}

message DB {
  pxf.Secret password = 1;
}

message Holder {
  string base_url = 1;
  DB db = 2;
  repeated DB dbs = 3;
  map<string, DB> db_by_name = 4;
  map<int32, pxf.Secret> by_id = 5;
  map<bool, pxf.Secret> by_flag = 6;
  google.protobuf.Any payload = 7;
}
