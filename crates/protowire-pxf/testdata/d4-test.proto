// Local fixture for the Rust port's D4 tests:
// pxf.required / pxf.default annotations and the `_null` FieldMask.
syntax = "proto3";
package d4_test.v1;

import "google/protobuf/field_mask.proto";
import "google/protobuf/wrappers.proto";
import "pxf/annotations.proto";

message WithRequired {
  string name = 1 [(pxf.required) = true];
  int32 value = 2;
}

message WithDefault {
  string name = 1 [(pxf.default) = "anonymous"];
  int32 count = 2 [(pxf.default) = "5"];
  bool active = 3 [(pxf.default) = "true"];
}

message WithNullMask {
  string name = 1;
  int32 value = 2;
  google.protobuf.FieldMask _null = 100;
}

message Outer {
  Inner inner = 1;
}

message Inner {
  string label = 1 [(pxf.default) = "fallback"];
  int32 num = 2;
}

// Oneof members (draft -01 §annotation-extensions, "Oneof Members";
// protowire-rust#24). A member's (pxf.default) applies only when no member
// of the oneof is present in the document; a proto3 `optional` field sits
// in a synthetic single-member oneof that nothing can clear, so its
// default keeps applying.
message OneofDefault {
  oneof choice {
    string a = 1;
    string b = 2 [(pxf.default) = "bbb"];
  }
  string outside = 3 [(pxf.default) = "out"];
}

message OneofNullableSibling {
  oneof choice {
    google.protobuf.StringValue w = 1;
    string b = 2 [(pxf.default) = "bbb"];
  }
}

message SyntheticOneof {
  optional string opt = 1 [(pxf.default) = "syn"];
}
