// @required with @default on one field (draft -01 "Required and Default").
// The compiler refuses this placement, so the generator compiles the two
// fields apart and moves `donor`'s options onto `target` (see README.md).
syntax = "proto3";
package carrier.required_default.v1;

import "protowire/schema/v1/annotations.proto";
import "protowire/schema/v1/descriptor.proto";

message M {
  string target = 1 @required;
  string donor = 2 @default("x");
}
