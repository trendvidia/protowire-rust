// Every (pxf.key) placement draft -01 §3.13.1 "Schema Placement" rejects.
// Non-conformant; one message per shape (protowire-rust#25).
syntax = "proto3";
package key_placement_test.v1;

import "pxf/annotations.proto";

message Item {
  string name = 1;
  int32 n = 2;
  repeated string names = 3;
}

message KeyOnScalar {
  repeated string tags = 1 [(pxf.key) = "name"];
}

message KeyOnSingularMessage {
  Item item = 1 [(pxf.key) = "name"];
}

message KeyNamesMissingField {
  repeated Item items = 1 [(pxf.key) = "id"];
}

message KeyNamesNonStringField {
  repeated Item items = 1 [(pxf.key) = "n"];
}

message KeyNamesRepeatedField {
  repeated Item items = 1 [(pxf.key) = "names"];
}
