// Schemas that place (pxf.default) where no PXF literal can denote the
// field (draft -01 §annotation-extensions, "Default Placement";
// protowire-rust#23, #25). One message per shape. Every message here is
// non-conformant, and a violating file poisons every message declared
// in it, so the accepted placements live in placement-accepted-test.proto.
syntax = "proto3";
package default_placement_test.v1;

import "google/protobuf/duration.proto";
import "pxf/annotations.proto";

message RepeatedDefault {
  repeated string tags = 1 [(pxf.default) = "ignored"];
}

message MapDefault {
  map<string, string> labels = 1 [(pxf.default) = "ignored"];
}

message ListMessage {
  repeated google.protobuf.Duration ds = 1 [(pxf.default) = "5s"];
}

message MapMessage {
  map<string, google.protobuf.Duration> m = 1 [(pxf.default) = "5s"];
}

message Plain {
  string x = 1;
}

message MessageNonWkt {
  Plain p = 1 [(pxf.default) = "ignored"];
}

// Conformant on its own; inherits the file's violations at bind time.
message Sibling {
  string ok = 1;
}
