// A bytes field of length 1 exports as one uint8 and imports back as a
// uint32 narrowed to uint8: the same byte (#104). Mirrors protowire-go's
// TestXMLRoundTripBytesLengthOne.
syntax = "proto3";
package one.v1;
import "sbe/annotations.proto";
option (sbe.schema_id) = 1;
message M {
  option (sbe.template_id) = 1;
  bytes b = 1 [(sbe.length) = 1];
}
