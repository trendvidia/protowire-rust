// What the SBE codec refuses to bind, or reads (#144); bounds-oracle.tsv
// holds what protowire-go does with it.
syntax = "proto3";
package bounds.group_map;

import "sbe/annotations.proto";

option (sbe.schema_id) = 1;
option (sbe.version) = 0;

message E {
  map<string, uint32> m = 1;
}

message M {
  option (sbe.template_id) = 1;
  repeated E e = 1;
}
