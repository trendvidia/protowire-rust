// What the SBE wire can hold (#122): each value, size and header field.
// Mirrors protowire-go's encoding/sbe/{encoding_range,header_bounds}_test.go;
// bounds-oracle.tsv holds what protowire-go does with each case.
syntax = "proto3";
package bounds.oneof_root;

import "sbe/annotations.proto";

option (sbe.schema_id) = 1;
option (sbe.version) = 0;

message M {
  option (sbe.template_id) = 1;
  oneof o {
    uint32 a = 1;
    uint32 b = 2;
  }
}
