// What the SBE codec refuses to bind, or reads (#144); bounds-oracle.tsv
// holds what protowire-go does with it.
syntax = "proto3";
package bounds.group_oneof;

import "sbe/annotations.proto";

option (sbe.schema_id) = 1;
option (sbe.version) = 0;

// protowire-go binds a oneof in a group entry, and a second member read
// clears the first (protowire-go#292). This port does the same, for now.
message E {
  oneof o {
    uint32 a = 1;
    uint32 b = 2;
  }
}

message M {
  option (sbe.template_id) = 1;
  repeated E e = 1;
}
