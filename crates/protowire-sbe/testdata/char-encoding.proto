syntax = "proto3";

package enc.v1;

import "sbe/annotations.proto";

option (sbe.schema_id) = 2;
option (sbe.version) = 0;

message Pair {
  // SBE characterEncoding "windows-1252" is not UTF-8 compatible, so this field is bytes.
  bytes code = 1 [(sbe.length) = 2];
  string tag = 2 [(sbe.length) = 2];
}

message Text {
  option (sbe.template_id) = 1;
  string plain = 1 [(sbe.length) = 4];
  string ascii = 2 [(sbe.length) = 4];
  string us_ascii = 3 [(sbe.length) = 4];
  string utf8 = 4 [(sbe.length) = 4];
  // SBE characterEncoding "ISO-8859-1" is not UTF-8 compatible, so this field is bytes.
  bytes latin1 = 5 [(sbe.length) = 4];
  Pair pair = 6;
}

